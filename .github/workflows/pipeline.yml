name: pipeline

on:
  schedule:
    - cron: "17 * * * *"      # hourly: collect cheap metadata
    - cron: "*/30 * * * *"    # every 30 min: answer keyword comments
    - cron: "43 */4 * * *"    # every 4h: research + score candidates
    - cron: "5 14 * * *"      # daily: generate, render, QC, publish
    - cron: "30 6 * * *"      # daily: analytics + learning
  workflow_dispatch:
    inputs:
      stage:
        description: "collect | research | produce | draft | engage | preview | zernio | analyze | all"
        default: collect
      max_videos:
        description: "Override MAX_VIDEOS_PER_DAY for this run (optional)"
        required: false
      sources:
        description: "Only these source types, e.g. rss,hn,arxiv (optional)"
        required: false
      min_score:
        description: "Override GENERATE_SCORE for this run (optional)"
        required: false

# One writer at a time: the SQLite state is restored/saved per run.
concurrency:
  group: pipeline-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
      VOICE_REF_REPO: ${{ vars.VOICE_REF_REPO }}
      VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.2' }}
      VOICE_STYLE_REF: ${{ vars.VOICE_STYLE_REF || 'style_reference.wav' }}
      VOICE_STYLE_BETA: ${{ vars.VOICE_STYLE_BETA || '0.0' }}
      VOICE_EXPRESSIVENESS: ${{ vars.VOICE_EXPRESSIVENESS || '1.5' }}
      WATERMARK_TEXT: ${{ vars.WATERMARK_TEXT }}
      DAILY_AI_BUDGET_USD: ${{ vars.DAILY_AI_BUDGET_USD || '1.00' }}
      MAX_LLM_CALLS_PER_DAY: ${{ vars.MAX_LLM_CALLS_PER_DAY || '100' }}
      MAX_VIDEOS_PER_DAY: ${{ github.event.inputs.max_videos || vars.MAX_VIDEOS_PER_DAY || '4' }}
      DAILY_GITHUB_VIDEOS: ${{ vars.DAILY_GITHUB_VIDEOS || '2' }}
      DAILY_NEWS_VIDEOS: ${{ vars.DAILY_NEWS_VIDEOS || '2' }}
      GENERATE_SCORE_NEWS: ${{ vars.GENERATE_SCORE_NEWS || '65' }}
      GENERATE_SOURCES: ${{ github.event.inputs.sources }}
      MAX_RENDERS_PER_TOPIC: ${{ vars.MAX_RENDERS_PER_TOPIC || '2' }}
      MIN_TOPIC_SCORE: ${{ vars.MIN_TOPIC_SCORE || '65' }}
      GENERATE_SCORE: ${{ github.event.inputs.min_score || vars.GENERATE_SCORE || '80' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pick stage
        id: stage
        run: |
          case "${{ github.event.schedule }}" in
            "17 * * * *")    s=collect ;;
            "*/30 * * * *")  s=engage ;;
            "43 */4 * * *")  s=research ;;
            "5 14 * * *")    s=produce ;;
            "30 6 * * *")    s=analyze ;;
            *)               s="${{ github.event.inputs.stage || 'collect' }}" ;;
          esac
          echo "name=$s" >> "$GITHUB_OUTPUT"

      - name: Cache voice-clone models
        if: ${{ env.VOICE_REPO_PAT != '' && (steps.stage.outputs.name == 'produce' || steps.stage.outputs.name == 'all' || steps.stage.outputs.name == 'preview' || steps.stage.outputs.name == 'draft') }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/nltk_data
          key: voice-models-v1

      - name: Install voice cloning (own voice)
        if: ${{ env.VOICE_REPO_PAT != '' && (steps.stage.outputs.name == 'produce' || steps.stage.outputs.name == 'all' || steps.stage.outputs.name == 'preview' || steps.stage.outputs.name == 'draft') }}
        continue-on-error: true   # a failed install falls back to Edge TTS
        run: |
          sudo apt-get install -y -qq espeak-ng libsndfile1
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install "styletts2-voice-clone[styletts2] @ git+https://github.com/oceanfarm1992-design/styletts2-voice-clone.git"

      - name: Restore state from `data` branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show origin/data:pipeline.db > data/pipeline.db
          fi

      - name: Run stage
        run: python -m pipeline ${{ steps.stage.outputs.name }}

      - name: Upload rendered videos
        if: steps.stage.outputs.name == 'produce' || steps.stage.outputs.name == 'all' || steps.stage.outputs.name == 'preview' || steps.stage.outputs.name == 'draft'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/video/*.mp4
            out/video/*.srt
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state to `data` branch
        if: always()
        run: |
          [ -f data/pipeline.db ] || exit 0
          sqlite3 data/pipeline.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          cp data/pipeline.db "$RUNNER_TEMP/pipeline.db"
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -rf -q --cached . && git clean -fdxq
          cp "$RUNNER_TEMP/pipeline.db" pipeline.db
          git add pipeline.db
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -f origin data-new:data
