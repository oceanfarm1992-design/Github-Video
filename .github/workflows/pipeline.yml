name: pipeline

on:
  # Triggered by cron-job.org (reliable, on time) through workflow_dispatch: engage every 30 min, collect
  # hourly at :17, research every 4 h, produce 05:05, 08:05, 11:05, 14:05, 17:05 UTC (one video each), analyze 06:30 UTC. GitHub's own `schedule`
  # was removed: it fired late and rarely, and a late scheduled run could cancel a queued produce run
  # (one concurrency group keeps only one pending run).
  workflow_dispatch:
    inputs:
      stage:
        description: "collect | research | tools | sites | promo | produce | draft | engage | preview | zernio | voicetest | analyze | all"
        default: collect
      max_videos:
        description: "Override MAX_VIDEOS_PER_DAY for this run (optional)"
        required: false
      sources:
        description: "Only these source types, e.g. github | tools | sites | promo | rss,hn,arxiv (optional)"
        required: false
      min_score:
        description: "Override GENERATE_SCORE for this run (optional)"
        required: false

# One writer at a time: the SQLite state is restored/saved per run.
concurrency:
  group: pipeline-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Non-secret settings only. Secrets are given to the single step that needs them ("Run stage"),
    # so third-party install steps (pip packages, Playwright) never see them.
    env:
      VOICE_REF_REPO: ${{ vars.VOICE_REF_REPO }}
      VOICE_SPEED: ${{ vars.VOICE_SPEED || '1.1' }}
      VOICE_STYLE_REF: ${{ vars.VOICE_STYLE_REF || 'style_reference.wav' }}
      VOICE_STYLE_BETA: ${{ vars.VOICE_STYLE_BETA || '0.3' }}
      VOICE_EXPRESSIVENESS: ${{ vars.VOICE_EXPRESSIVENESS || '1.0' }}
      SCROLL_SPEED: ${{ vars.SCROLL_SPEED || '200' }}
      MUSIC_STYLE: ${{ vars.MUSIC_STYLE || 'hacker' }}
      BUFFER_PINTEREST_BOARD: ${{ vars.BUFFER_PINTEREST_BOARD }}
      MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME || '0.22' }}
      WATERMARK_TEXT: ${{ vars.WATERMARK_TEXT }}
      DAILY_AI_BUDGET_USD: ${{ vars.DAILY_AI_BUDGET_USD || '1.00' }}
      MAX_LLM_CALLS_PER_DAY: ${{ vars.MAX_LLM_CALLS_PER_DAY || '100' }}
      MAX_VIDEOS_PER_DAY: ${{ github.event.inputs.max_videos || vars.MAX_VIDEOS_PER_DAY || '5' }}
      MAX_VIDEOS_PER_RUN: ${{ vars.MAX_VIDEOS_PER_RUN || '1' }}
      DAILY_GITHUB_VIDEOS: ${{ vars.DAILY_GITHUB_VIDEOS || '2' }}
      DAILY_NEWS_VIDEOS: ${{ vars.DAILY_NEWS_VIDEOS || '0' }}
      DAILY_SITES_VIDEOS: ${{ vars.DAILY_SITES_VIDEOS || '1' }}
      SITES_PER_VIDEO: ${{ vars.SITES_PER_VIDEO || '1' }}
      DAILY_TOOLS_VIDEOS: ${{ vars.DAILY_TOOLS_VIDEOS || '1' }}
      DAILY_PROMO_VIDEOS: ${{ vars.DAILY_PROMO_VIDEOS || '1' }}
      TOOLS_PER_VIDEO: ${{ vars.TOOLS_PER_VIDEO || '10' }}
      GENERATE_SCORE_NEWS: ${{ vars.GENERATE_SCORE_NEWS || '65' }}
      GENERATE_SOURCES: ${{ github.event.inputs.sources }}
      MAX_RENDERS_PER_TOPIC: ${{ vars.MAX_RENDERS_PER_TOPIC || '2' }}
      MIN_TOPIC_SCORE: ${{ vars.MIN_TOPIC_SCORE || '65' }}
      GENERATE_SCORE: ${{ github.event.inputs.min_score || vars.GENERATE_SCORE || '75' }}
    steps:
      # actions pinned to commit SHAs (tags can be moved); comments show the tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # no repo token left in .git/config for later steps to read

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pick stage
        id: stage
        run: |
          case "${{ github.event.schedule }}" in
            "17 * * * *")    s=collect ;;
            "*/30 * * * *")  s=engage ;;
            "43 */4 * * *")  s=research ;;
            "5 9 * * *")     s=produce ;;
            "5 14 * * *")    s=produce ;;
            "30 6 * * *")    s=analyze ;;
            *)               s="${{ github.event.inputs.stage || 'collect' }}" ;;
          esac
          echo "name=$s" >> "$GITHUB_OUTPUT"
          case "$s" in produce|all|preview|draft|voicetest) echo "heavy=true" >> "$GITHUB_OUTPUT" ;; *) echo "heavy=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Cache voice-clone models
        if: ${{ vars.VOICE_REF_REPO != '' && steps.stage.outputs.heavy == 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/nltk_data
          key: voice-models-v1

      - name: Install voice cloning (own voice)
        if: ${{ vars.VOICE_REF_REPO != '' && steps.stage.outputs.heavy == 'true' }}
        continue-on-error: true   # a failed install falls back to Edge TTS
        run: |
          sudo apt-get install -y -qq espeak-ng libsndfile1
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install "styletts2-voice-clone[styletts2] @ git+https://github.com/oceanfarm1992-design/styletts2-voice-clone.git"

      - name: Cache Chromium
        if: ${{ steps.stage.outputs.heavy == 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Chromium (page scroll scenes)
        if: ${{ steps.stage.outputs.heavy == 'true' }}
        continue-on-error: true   # without it, videos fall back to the preview card
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore state from `data` branch
        id: restore
        run: |
          set -euo pipefail
          mkdir -p data
          # exit 2 = branch really absent (first run); any other failure must stop the run, otherwise
          # an empty database would overwrite the saved state (losing the duplicate-post guard)
          rc=0; git ls-remote --exit-code --heads origin data >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --depth=1 origin data
            git show origin/data:pipeline.db > data/pipeline.db
            [ -s data/pipeline.db ] || { echo "restored state is empty"; exit 1; }
          elif [ "$rc" != 2 ]; then
            echo "cannot reach the data branch (rc=$rc)"; exit 1
          fi

      - name: Run stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: python -m pipeline ${{ steps.stage.outputs.name }}

      - name: Upload rendered videos
        if: ${{ steps.stage.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/video/*.mp4
            out/video/*.srt
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state to `data` branch
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f data/pipeline.db ] || exit 0
          sqlite3 data/pipeline.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          cp data/pipeline.db "$RUNNER_TEMP/pipeline.db"
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -rf -q --cached . && git clean -fdxq
          cp "$RUNNER_TEMP/pipeline.db" pipeline.db
          git add pipeline.db
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-new:data
